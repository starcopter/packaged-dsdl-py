name: Build

on:
  push:
    branches:
      - "!main"
    paths:
      - submodules/*
      - scripts/compile.sh
      - pyproject.toml
      - .github/workflows/build.yaml

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Dump GitHub context
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}
        run: echo "$GITHUB_CONTEXT"

      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Compile DSDL
        run: uv run --dev scripts/compile.sh

      - name: Build
        run: uv build

      - name: Create bot user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit and push changes
        run: |
          git add src
          git commit -m "📦️ Update compiled DSDL

          Triggered in response to changes in ${{ github.event.head_commit.id }}.

          Co-authored-by: ${{ github.event.head_commit.author.name || github.actor }} <${{ github.event.head_commit.author.email }}>"
          git push

      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
